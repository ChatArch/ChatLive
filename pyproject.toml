[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatLive"
dynamic = ["version"]
description = "ChatLive: ChatArch live tooling package entrypoint."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatlive", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatLive"
Repository = "https://github.com/ChatArch/ChatLive"
Documentation = "https://arch.gh.wzhecnu.cn/ChatLive/"

[project.scripts]
chatlive = "chatlive.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatlive.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
